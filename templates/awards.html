{% extends 'base.html' %}

{% block content %}
<section>
    <h2>Awards</h2>
    {% for year, items in awards.items() %}
        <h3>{{ year }}</h3>
        <ul class="item-list" data-stagger>
            {% for award in items %}
            <li class="item-card reveal">
                <b>{{ award.title }}</b> granted by <b>{{ award.organization }}</b>: {{ award.description }}
            </li>
            {% endfor %}
        </ul>
    {% endfor %}
</section>
{% endblock %}
