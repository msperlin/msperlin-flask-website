{% extends 'base.html' %}

{% block content %}
<section>
    <h1>Awards</h1>
    {% for year, items in awards.items() %}
        <h2 class="year-heading">{{ year }}</h2>
        <ul class="item-list" data-stagger>
            {% for award in items %}
            <li class="item-card reveal">
                <strong>{{ award.title }}</strong> granted by <strong>{{ award.organization }}</strong>: {{ award.description }}
            </li>
            {% endfor %}
        </ul>
    {% endfor %}
</section>
{% endblock %}
