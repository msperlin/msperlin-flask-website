{% extends 'base.html' %}

{% block content %}
<section>
    <h1>Interviews, lectures and News</h1>
    {% for year, items in news.items() %}
        <h2 class="year-heading">{{ year }}</h2>
        <ul class="item-list" data-stagger>
            {% for item in items %}
            <li class="item-card reveal">
               <a href="{{item.link}}"> {{ item.title }} </a> published by <b>{{item.source }}</b>{% if item.pdf_url %} (<a href="{{ item.pdf_url }}" target="_blank" rel="noopener noreferrer" aria-label="PDF of {{ item.title }} (opens in a new tab)">PDF</a>){% endif %}.
            </li>
            {% endfor %}
        </ul>
    {% endfor %}
</section>
{% endblock %}
