name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Install Playwright Chromium
      run: uv run playwright install --with-deps chromium-headless-shell

    - name: Run tests
      run: uv run pytest -n 4 --dist worksteal -q
