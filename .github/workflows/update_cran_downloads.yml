name: Update R Package Downloads (CRAN)

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  update-cran-downloads:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Run CRAN downloads script
      run: python scripts/update_cran_downloads.py
      
    - name: Check for changes
      id: git-check
      run: |
        git add data/code/r/*.json
        git diff --staged --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

    - name: Commit and push changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -m "Update CRAN downloads for R packages"
        git push
