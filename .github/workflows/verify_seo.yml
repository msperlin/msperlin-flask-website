name: Verify SEO and Metadata

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-seo:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run SEO verification script
      run: uv run python scripts/verify_seo.py
