name: Update Google Scholar Stats

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run scholarly script
      run: uv run python scripts/run_scholarly.py
  
    - name: Check for changes
      id: git-check
      run: |
        git add data/stats/gscholar.json data/code/r/*.json
        git diff --staged --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

    - name: Commit and push changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -m "Update stats and R package downloads"
        git push
