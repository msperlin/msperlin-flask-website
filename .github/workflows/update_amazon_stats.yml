name: Update Amazon Book Ratings

on:
  schedule:
    - cron: '0 1 * * 0' # Run every Sunday at 1:00 AM (one hour after Scholar stats)
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  update-amazon-stats:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Run Amazon stats script
      run: python scripts/update_amazon_stats.py
  
    - name: Check for changes
      id: git-check
      run: |
        git add data/stats/amazon_books.json
        git diff --staged --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

    - name: Commit and push changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -m "Update Amazon book ratings"
        git push
