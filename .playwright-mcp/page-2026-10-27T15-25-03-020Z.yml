            - paragraph [ref=f58e30]: Uma população que não poupa e não sabe investir está fadada a continuar presa no ciclo vicioso da dependência financeira - mais gastos, mais trabalho e menos tempo. A falta de intimidade da população com a organização de um orçamento doméstico e com a aplicação do dinheiro de forma eficiente é certamente um dos problemas estruturais da economia brasileira. Este livro apresenta uma forma de investir com foco no longo prazo, resiliência e na qualidade de vida do investidor. Contrário a crença popular, investir para o longo prazo é fácil e pode ser feito por qualquer pessoa com vontade de aprender. O grande diferencial da obra é o uso frequente de dados financeiros reais para entender melhor como o mercado de renda fixa funciona, os efeitos dos tributos e custos operacionais, e quais são as melhores opções para o investidor pessoa física.
