            - paragraph [ref=f24e60]: Visualização de dados é a arte de transformar medidas em padrões visuais. O objetivo é incrivelmente simples, apresentar evidências de um evento ou causalidade do mundo real. E, como qualquer arte, é fácil de descrever e difícil de executar. Na prática, construir figuras baseadas em dados exige expertise da área de conhecimento, uma noção de design e conhecimento das ferramentas corretas de programação. O retorno para o autor, porém, é imenso. Em um mundo digitalizado, gráficos baseados em dados são compartilhados com o mundo inteiro em questões de segundos, ao clique de um botão. Todo o material do livro, incluindo gráficos e código, é aberto ao público e reproduzível. Para facilitar a importação dos dados, construí um módulo do R chamado vdr, o qual pode ser instalado de forma prática e fácil. Este pacote contém todos os dados e funções usados no livro. Com ele será possível importar dados para a sua sessão do R e rodar todos os exemplos no seu próprio computador.
