        - generic [ref=f101e63]:
          - heading "Sobre o autor" [level=2] [ref=f101e64]
          - paragraph [ref=f101e65]:
            - text: Sou professor associado ao programa de pós-graduação na escola de Administração da UFRGS (Universidade Federal do Rio Grande do Sul). Ao longo dos mais de 12 anos de minha carreira como acadêmico, a análise de dados sempre foi uma constante, tendo como saída diversas publicações científicas nacionais e internacionais nos tópicos de econometria financeira, mercado de capitais, finanças corporativas e cientometria. Além disso, sou autor e mantenedor de 11 pacotes de R distribuídos no
            - link "CRAN" [ref=f101e66] [cursor=pointer]:
              - /url: https://cloud.r-project.org/web/packages/available_packages_by_date.html
            - text: e
            - link "Github" [ref=f101e67] [cursor=pointer]:
              - /url: https://github.com/msperlin
            - text: . Maiores informações sobre o meu trabalho acadêmico, códigos de programação e formas de contato podem ser encontrados em minha
            - link "página pessoal" [ref=f101e68] [cursor=pointer]:
              - /url: https://www.msperlin.com
            - text: .
        - generic [ref=f101e69]:
          - heading "Livros do Autor" [level=2] [ref=f101e70]
          - list [ref=f101e71]:
            - listitem [ref=f101e72]:
              - paragraph [ref=f101e73]:
                - link "Poupando e Investindo em Renda Fixa" [ref=f101e74] [cursor=pointer]:
                  - /url: https://www.amazon.com.br/dp/B07RR9K9PV
                - text: ": Este livro apresenta uma forma de investir com foco no longo prazo, resiliência e na qualidade de vida do investidor. Contrário a crença popular, investir para o longo prazo é fácil e pode ser feito por qualquer pessoa com vontade de aprender. O grande diferencial da obra é o uso frequente de dados financeiros reais para entender melhor como o mercado de renda fixa funciona, os efeitos dos tributos e custos operacionais, e quais são as melhores opções para o investidor pessoa física. Cada capítulo do livro apresenta e analisa os principais produtos disponíveis na renda fixa: produtos bancários (CDBs, LCA, entre outros), Tesouro Direto (Prefixado, IPCA+, SELIC), fundos de renda fixa e debêntures."
            - listitem [ref=f101e75]:
