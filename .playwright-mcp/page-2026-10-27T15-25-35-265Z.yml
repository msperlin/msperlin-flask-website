  - main [ref=f81e27]:
    - generic [ref=f81e28]:
      - heading "Code (R)" [level=2] [ref=f81e29]
      - paragraph [ref=f81e30]: I fell that unrestricted access to organized datasets is one of the pillars of reproducible research, which is why I've taken so much interest in it over the years. As a result, I'm the author of many R packages distributed in CRAN. Most packages are related to importing and organizing financial and economic datasets from public sources.
      - paragraph [ref=f81e31]:
        - text: If you used one of the packages in research, please use the proper citation format with R code
        - code [ref=f81e32]: citation('pkgname')
        - text: .
      - heading "R Packages:" [level=3] [ref=f81e33]
      - paragraph [ref=f81e34]:
        - text: All packages are available at
        - link "msperlin.r-universe.dev/builds" [ref=f81e35] [cursor=pointer]:
          - /url: https://msperlin.r-universe.dev/builds
