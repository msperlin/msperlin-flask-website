  - main [ref=f37e27]:
    - generic [ref=f37e28]:
      - heading "Data" [level=2] [ref=f37e29]
      - paragraph [ref=f37e30]: A major part of my work as an academic researcher is finding ways to access and organize financial and economic datasets using code. In this section I'll provide a download link for the full datasets I use for research or class material. All files represent the _whole_ database, iterating by available time periods and cases. These files are raw and come with **no warranty**. Be aware that you'll probably need to clean it up before any good use. As such, please make sure to cite the original source for reproducibility (see citation format from dataverse).
      - paragraph [ref=f37e31]:
        - text: All data is distributed using the
        - link "Harvard Dataverse Project" [ref=f37e32] [cursor=pointer]:
          - /url: https://dataverse.harvard.edu/dataverse/msperlin
        - text: . The Dataverse platform is stable, provides data persistency, versioning and the automatic generation of citation text. You can even use the
        - link "dataverse" [ref=f37e33] [cursor=pointer]:
          - /url: https://github.com/IQSS/dataverse-client-r
        - text: package for reading the files from an R session.
      - paragraph [ref=f37e34]: All hosted data will be updated at least once a year.
