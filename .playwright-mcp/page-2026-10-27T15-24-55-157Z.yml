  - main [ref=f53e11]:
    - generic [ref=f53e12]:
      - heading "Consulting Services" [level=2] [ref=f53e13]
      - paragraph [ref=f53e14]: "I offer consulting services in the areas of data science, financial analysis, and programming in R and Python. I have the flexibility to work on small (couple of weeks) or large projects (over a year). I have experience in:"
      - list [ref=f53e15]:
        - listitem [ref=f53e16]: the full cycle of a data based research, from data importation to analysis and reporting;
        - listitem [ref=f53e17]: using R and Python to write data pipelines, import and analyze larger-than-RAM and unstructured datasets;
        - listitem [ref=f53e18]: using machine learning models in R (tidymodels) and Python (scikit-learn) in prediction problems, with real world business applications such as fraud detection;
        - listitem [ref=f53e19]: using LLM (large language models) such as ChatGPT and Gemini for solving research problems in large scale;
        - listitem [ref=f53e20]: writing open source R and Python packages, and publishing in CRAN and pypi.org;
        - listitem [ref=f53e21]: using cloud tools such as servers/computing, storage and APIs from the usual suspects (AWS, Google Cloud, Azure).
      - separator [ref=f53e22]
      - heading "Services Offered" [level=3] [ref=f53e23]
      - generic [ref=f53e24]:
        - generic [ref=f53e25]:
          - heading "Data Analysis & Visualization" [level=4] [ref=f53e26]
          - paragraph [ref=f53e27]: Transforming raw, unstructured data into clean, organized formats ready for analysis and modeling. This includes data cleaning, exploratory analysis and compelling data visualizations.
        - generic [ref=f53e28]:
          - heading "Modelling & Simulation" [level=4] [ref=f53e29]
          - paragraph [ref=f53e30]: Transforming data into actionable business insights. This includes supervised and unsupervised machine learning models, financial econometrics and the use of LLMs (large language models) for data analysis.
        - generic [ref=f53e31]:
          - heading "Custom Programming Solutions" [level=4] [ref=f53e32]
          - paragraph [ref=f53e33]: Developing custom scripts and applications in R and Python for automating data-related tasks and research. This includes webscrapping scripts and general automation of data tasks. If you got an idea and want to test it over large quantities of real data, get in touch.
      - separator [ref=f53e34]
      - paragraph [ref=f53e35]:
        - text: If you have an interesting and challenging data problem, please reach out via email (
        - link "marceloperlin@gmail.com" [ref=f53e36] [cursor=pointer]:
          - /url: mailto:marceloperlin@gmail.com
        - text: ).
