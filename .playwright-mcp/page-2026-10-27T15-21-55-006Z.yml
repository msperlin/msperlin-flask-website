  - main [ref=f14e27]:
    - generic [ref=f14e28]:
      - heading "Code (R)" [level=2] [ref=f14e29]
      - paragraph [ref=f14e30]: I fell that unrestricted access to organized datasets is one of the pillars of reproducible research, which is why I've taken so much interest in it over the years. As a result, I'm the author of many R packages distributed in CRAN. Most packages are related to importing and organizing financial and economic datasets from public sources.
      - paragraph [ref=f14e31]:
        - text: If you used one of the packages in research, please use the proper citation format with R code
        - code [ref=f14e32]: citation('pkgname')
        - text: .
      - heading "R Packages:" [level=3] [ref=f14e33]
      - paragraph [ref=f14e34]:
        - text: All packages are available at
        - link "msperlin.r-universe.dev/builds" [ref=f14e35] [cursor=pointer]:
          - /url: https://msperlin.r-universe.dev/builds
