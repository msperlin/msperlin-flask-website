      - heading "Code (R)" [level=2] [ref=f59e13]
      - paragraph [ref=f59e14]: I fell that unrestricted access to organized datasets is one of the pillars of reproducible research, which is why I've taken so much interest in it over the years. As a result, I'm the author of many R packages distributed in CRAN. Most packages are related to importing and organizing financial and economic datasets from public sources.
      - paragraph [ref=f59e15]:
        - text: If you used one of the packages in research, please use the proper citation format with R code
        - code [ref=f59e16]: citation('pkgname')
        - text: .
