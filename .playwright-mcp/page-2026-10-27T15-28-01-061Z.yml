                - text: ": Uma introdução ao uso do R e RStudio para a área específica de finanças. O livro texto contém 13 capítulos que explicam todo o processo de pesquisa com o R, desde aquisição dos dados até o reporte de resultados em planilhas e figuras. Versão online disponível em"
                - link "https://www.msperlin.com/adfeR/" [ref=f101e78] [cursor=pointer]:
                  - /url: https://www.msperlin.com/adfeR/
                - text: .
